    <!-- Auto-trigger the gBbk76 pop-up form once per browser session -->
    <script>
      (function () {
        var SHOWN_KEY = 'gc-popup-gBbk76-shown';
        if (sessionStorage.getItem(SHOWN_KEY)) return;
        window.addEventListener('load', function () {
