[build]
  command = "npm run build"
  publish = "dist"

# girlhoodcincy.com is the single canonical domain for this project.
# brittanygruber.com (apex + www) should also resolve here, but redirect
# to the canonical domain instead of serving duplicate content.
[[redirects]]
  from = "https://brittanygruber.com/*"
  to = "https://girlhoodcincy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.brittanygruber.com/*"
  to = "https://girlhoodcincy.com/:splat"
  status = 301
  force = true
